name: Firebase production

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy beelzebub.io
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://beelzebub.io

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated website
        uses: actions/download-artifact@v8
        with:
          name: website-static
          path: website/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO repository secret before deploying production."
            exit 1
          fi

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO }}
          projectId: beelzebub-io
          channelId: live
          firebaseToolsVersion: 15.26.0
