name: CI

on:
  push:
    branches: [master, main, 'dev/**']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.15.0', '26.x']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix examples ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package

  quality:
    name: Coverage, docs, audit, and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json

      - run: npm install --global npm@12.0.1
      - run: |
          npm ci
          npm --prefix examples ci
      - name: Run coverage
        id: coverage
        continue-on-error: true
        run: npm run coverage

      - name: Create coverage summary
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: node scripts/coverage-summary.js coverage-summary.md

      - name: Post coverage summary
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- beelzebub-coverage-report -->';
            const body = fs.readFileSync('coverage-summary.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Enforce coverage result
        if: always() && steps.coverage.outcome != 'success'
        run: exit 1

      - run: npm run build
      - run: npm run site:check
      - run: npm run validate-pkg
      - run: npm run audit

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: website-static
          path: website/dist/
          if-no-files-found: error

  preview:
    name: Firebase Hosting preview (PR only)
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Download validated website
        uses: actions/download-artifact@v8
        with:
          name: website-static
          path: website/dist

      - name: Verify Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO repository secret before deploying previews."
            exit 1
          fi

      - name: Deploy Firebase preview
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BEELZEBUB_IO }}
          projectId: beelzebub-io
          expires: 7d
          firebaseToolsVersion: 15.26.0
